<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <form action="sucesso.html" method="get">

        <p>
            <label for="iano">Em que ano voce nasceu?:</label>
            <input type="number" name="ano" id="iano" min="1900" max="2026" required oninput="calcIdade()">
        </p>

        <p>
            <label for="iidade">Qual sua idade?:</label>
            <output id="idade">0</output>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>

    <script>

        /**
         * Calcula a idade do usuario com base no ano de nascimento
         * 
         * @return {void} 
         */
        
        function calcIdade() {
            let atual = new Date().getFullYear()
            idade.innerHTML = Number(atual) - Number(iano.value)
        }
    </script>
</body>
</html>
